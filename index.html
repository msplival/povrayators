<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>povray benchmarks</title>
  <style>
    body { font-family: monospace; margin: 2em; }
    table { border-collapse: collapse; }
    th, td { border: 1px solid #444; padding: 4px 8px; white-space: nowrap; }
    th { background: #eee; }
    td.num { text-align: right; }
  </style>
</head>
<body>

<h1>Local Jekyl Template Test</h1>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Last Name</th>
      <th>Height</th>
      <th>Date of birth</th>
    </tr>
  </thead>
  <tbody>
    {% assign runs = site.data.people | sort: "height" %}
    {% for r in runs %}
    <tr>
      <td>{{ r.name }}</td>
      <td>{{ r.last }}</td>
      <td class="num">{{ r.height }}</td>
      <td class="num">{{ r.date_of_birth }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
